quarkus.http.host=127.0.0.1
quarkus.http.port=8080
quarkus.http.limits.max-body-size=64K
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,Idempotency-Key
quarkus.smallrye-openapi.path=/q/openapi
wallet.db.path=${WALLET_DB_PATH:./data/hackathon.db}
%test.quarkus.http.test-port=0
%test.wallet.db.path=./target/test-hackathon.db
